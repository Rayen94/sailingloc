name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Install client dependencies
        working-directory: client
        run: npm install

      - name: Security audit (production dependencies)
        run: |
          npm --prefix server audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

      - name: Server lint
        working-directory: server
        run: npm run lint --if-present

      - name: Client lint
        working-directory: client
        run: npm run lint --if-present

      - name: Server format check
        working-directory: server
        run: npm run format:check --if-present

      - name: Client format check
        working-directory: client
        run: npm run format:check --if-present

      - name: Server tests
        working-directory: server
        run: npm run test:coverage --if-present

      - name: Client unit tests (Vitest)
        working-directory: client
        run: npm run test:coverage --if-present

      - name: Client build
        working-directory: client
        run: npm run build

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Playwright E2E
        working-directory: client
        run: npm run test:e2e --if-present
